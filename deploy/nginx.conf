# Nginx configuration for the Chat PWA on a Hostinger VPS.
#
# The SPA and the API share the same origin, so the session cookie stays
# first party and the CSRF token travels with every request. Nginx terminates
# TLS and proxies the WebSocket upgrade to Laravel Reverb.
#
# Replace `chat.example.com` with the real domain and adjust the paths to
# match where the project lives on the server.

server {
    listen 80;
    listen [::]:80;

    server_name chat.example.com www.chat.example.com;

    # Certbot rewrites this block to redirect every request to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name chat.example.com www.chat.example.com;

    root /var/www/chat/frontend/dist;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # The SPA is a static bundle; the API answers the rest.
    client_max_body_size 25M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Hashed assets never change, so they can be cached for a year.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Laravel Reverb serves the WebSocket connection.
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location ~ ^/broadcasting/auth$ {
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/storage/ {
        alias /var/www/chat/backend/storage/app/public/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/chat/backend/public;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/chat/backend/public$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    # The service worker must never be cached, otherwise the PWA keeps an
    # outdated bundle after a deployment.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
