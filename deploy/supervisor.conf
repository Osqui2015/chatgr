; Supervisor configuration for the background workers of the Chat PWA.
;
; The queue worker sends the broadcast messages and the emails, and the Reverb
; server handles the WebSocket connections. Both must survive a reboot.
;
; Install it with:
;   sudo cp deploy/supervisor.conf /etc/supervisor/conf.d/chat.conf
;   sudo supervisorctl reread && sudo supervisorctl update

[program:chat-queue]
process_name=%(program_name)s
command=php /var/www/chat/backend/artisan queue:work redis --sleep=1 --tries=3 --max-time=3600 --timeout=90
directory=/var/www/chat/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/chat/backend/storage/logs/queue.log
; The worker needs a moment to finish the current job before it is killed.
stopwaitsecs=120

[program:chat-reverb]
process_name=%(program_name)s
command=php /var/www/chat/backend/artisan reverb:start --host=0.0.0.0 --port=8080 --server=production
directory=/var/www/chat/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/chat/backend/storage/logs/reverb.log
stopwaitsecs=30
